name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify dependencies
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Install analysis tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Check GitHub Actions workflows
        run: actionlint

      - name: Run tests
        # Broad randomization catches interactions introduced by new tests.
        run: go test -shuffle=on -count=1 ./...

      - name: Run command race tests
        run: |
          # Repeat the historical failing orders in one process: -count checks
          # accumulated Cobra/config state; it is intentionally not reshuffled.
          go test -race -shuffle=1787488288865406000 -count=3 ./cmd
          go test -race -shuffle=1787505475779618000 -count=3 ./cmd

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Run complexity checks
        run: golangci-lint run --enable-only gocognit,gocyclo --tests=false

      - name: Run deadcode
        run: |
          deadcode_output="$(deadcode ./...)"
          if [[ -n "${deadcode_output}" ]]; then
            printf '%s\n' "${deadcode_output}"
            exit 1
          fi

      - name: Run vulnerability scan
        run: govulncheck ./...

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean --skip=publish
