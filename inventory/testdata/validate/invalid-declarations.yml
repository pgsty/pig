all:
  children:
    infra:
      hosts:
        10.0.0.1: { infra_seq: 1 }
    etcd:
      hosts:
        10.0.0.1: { etcd_seq: 1 }
      vars: { etcd_cluster: etcd }
    pgsql:
      hosts:
        10.0.0.1: { pg_seq: 1, pg_role: primary }
      vars:
        pg_cluster: pgsql
        pg_users:
          - { name: 42 }
        pg_databases:
          - { owner: app }
        pg_services:
          - { name: bad-port, port: 70000, dest: invalid }
        pg_hba_rules:
          - { title: bad rule, user: all, db: all, addr: invalid, auth: invalid }
        pg_vip_enabled: true
  vars:
    version: v4.4.0
    admin_ip: 10.0.0.1
    region: default
